# Deploys hause.ca (the hause-ca Cloudflare Worker, static assets in hause/public) whenever hause/ changes on this
# branch or main, or on demand from the Actions tab. Needs the repository or organization secret CLOUDFLARE_API_TOKEN
# (Workers edit permission) and, if the token can see more than one account, CLOUDFLARE_ACCOUNT_ID.
name: Deploy hause.ca
on:
  push:
    branches: [main, claude/peaceful-volta-3vrwhg]
    paths: ["hause/**", ".github/workflows/deploy-hause.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-hause
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hause
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the token is there
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret is available to this repository; skipping the deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
